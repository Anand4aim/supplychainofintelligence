      <h1>The Supply Chain of Intelligence™ — by Anand Arivukkarasu</h1>
      <p><strong>JTBD tells you what users want. The Supply Chain of Intelligence tells you where AI value accrues — and who can fire your product.</strong></p>
      <p><em>Scope:</em> This framework analyzes the <strong>generative AI software stack</strong> — semiconductors, foundation models, agent execution, orchestration, surfaces, and memory — for SaaS product leaders, AI founders, and venture capital investors. It is <strong>not</strong> about physical supply chain management, freight, warehousing, shipping, or logistics operations.</p>
      <p>A structural framework by Anand Arivukkarasu (Ex-Meta product leader) for SaaS founders, product leaders, and venture investors. It maps where AI value is created, captured, and defended across 10 layers and 50 sublayers.</p>

      <h2>The 10 Layers</h2>
      <ol>
        <li><strong>L-1 Resources:</strong> Energy, water, fabrication capacity, critical materials, skilled trades.</li>
        <li><strong>L0 Infrastructure:</strong> Silicon, data centers, interconnect, cloud, edge compute.</li>
        <li><strong>L1 Data:</strong> Public, proprietary, behavioral, outcome, and synthetic data.</li>
        <li><strong>L2 Models:</strong> Foundation, specialized, embedding, routing, and reasoning models.</li>
        <li><strong>L3 Gatekeeping:</strong> Compliance, quality, safety, editorial, and distribution gates.</li>
        <li><strong>L4 Access:</strong> APIs, agent protocols (MCP), governance, real-time pipes, agent identity.</li>
        <li><strong>L5 Execution:</strong> Domain skills, decision frameworks, RAG workflows, operating playbooks, interactional skills.</li>
        <li><strong>L6 Orchestration:</strong> Agent loops, human-in-the-loop, role routing, context state, runtime assurance.</li>
        <li><strong>L7 Surface:</strong> Conversational, visual, embedded/copilot, transactional, and ambient surfaces.</li>
        <li><strong>L8 Memory:</strong> Session, entity, network, institutional, and world-model memory.</li>
      </ol>

      <h2>The 3 Structural Laws</h2>
      <ol>
        <li><strong>Intelligence Commoditizes Downward.</strong> If a product depends only on generic model capability, the platform layer below it absorbs the value. Wrappers become features.</li>
        <li><strong>Value Accrues at Bottlenecks.</strong> Durable value sits at the scarce layer — proprietary data, workflow control, verification, distribution, memory, compliance, or trust.</li>
        <li><strong>The Surface Captures Attention; the Chain Captures Power.</strong> A beautiful UI gets users. Durable companies own a deeper layer of the chain.</li>
      </ol>

      <h2>The Defensible Triangle</h2>
      <p>The most common fortress pattern for application-layer AI companies: <strong>L1b proprietary data + L5a/b/d deep skills and playbooks + L8c/d/e compounding memory</strong>. Owning one layer deeply (Vanta on L3, NVIDIA on L0, Snowflake on L4) is another route to survival.</p>

      <h2>The AI Defensibility Audit</h2>
      <p>An eight-question scorecard scoring 1–5 across model dependency, data ownership, workflow depth, trust gate, distribution, memory, switching cost, and platform exposure. Scores classify a product as Thin Wrapper, Useful Tool with Weak Moat, Workflow Product, Defensible AI System, or Intelligence Gate.</p>

      <h2>The Intelligence Cube</h2>
      <p>A diagnostic plotting any company across 10 functions × 10 verticals × 10 layers. Volume in the Cube equals structural durability.</p>

      <p><strong>JTBD finds demand. The Supply Chain of Intelligence finds defensibility.</strong></p>
